[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-engineering-academy"
version = "0.1.0"
description = "An AI engineering curriculum organized around demonstrable capability"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.9",
    "jupytext>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
notebook = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
strict_markers = true
testpaths = ["modules"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.jupytext]
formats = "ipynb,py:percent"
