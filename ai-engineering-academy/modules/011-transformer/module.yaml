id: 011-transformer
title: "The Transformer Block (Feed-Forward Networks, LayerNorm & Residual Connections)"
version: "1.0.0"
difficulty: "Advanced"
prerequisites:
  - "003-backprop"
  - "005-regularization"
  - "010-attention"
estimated_minutes: 85
author: "AI Engineering Academy"
license: "MIT"
created_date: "2026-08-01"

summary: >
  Assembles the complete Transformer Encoder Block from scratch in pure Python & NumPy:
  Multi-Head Self-Attention + Position-wise FFN + Pre-LayerNorm + Residual Connections.
  Stacks multiple blocks into a working Transformer Encoder.

outcomes:
  - "Implement TransformerFFN, TransformerEncoderBlock, and TransformerEncoder from scratch"
  - "Derive why Pre-LayerNorm (before sublayer) is more training-stable than Post-LayerNorm"
  - "Prove how residual connections x + Sublayer(x) create gradient highways identical to ResNets"
  - "Assemble a full stacked Transformer Encoder and run a forward pass on a token sequence"

sources:
  - name: "Vaswani et al. (2017) Attention Is All You Need"
    url: "https://arxiv.org/abs/1706.03762"
    type: "Paper"
  - name: "Ba et al. (2016) Layer Normalization"
    url: "https://arxiv.org/abs/1607.06450"
    type: "Paper"
