id: 017-moe
title: "Mixture-of-Experts (MoE) Architecture & Top-k Gating with Load Balancing"
version: "1.0.0"
difficulty: "Advanced"
prerequisites:
  - "011-transformer"
estimated_minutes: 90
author: "AI Engineering Academy"
license: "MIT"
created_date: "2026-08-02"

summary: >
  Implements Sparse Mixture-of-Experts (MoE) from scratch in pure Python & NumPy:
  Top-k softmax gating router, aux loss (load balancing loss) calculation,
  sparse token routing to experts, and expert output aggregation.

outcomes:
  - "Implement Top-k Softmax Gating Router with noise injection"
  - "Implement auxiliary load balancing loss (Switch Transformer style)"
  - "Implement sparse token-to-expert dispatch and output aggregation"
  - "Compare active parameter count (e.g. 13B active) vs total parameter count (47B total) in MoE models"

sources:
  - name: "Shazeer et al. (2017) Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer"
    url: "https://arxiv.org/abs/1701.06538"
    type: "Paper"
  - name: "Fedus et al. (2022) Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity"
    url: "https://arxiv.org/abs/2101.03961"
    type: "Paper"
