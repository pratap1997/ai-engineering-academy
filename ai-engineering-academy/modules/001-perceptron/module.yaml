schema_version: 1

id: 001-perceptron
title: Perceptron From Scratch
status: draft
difficulty: beginner
estimated_hours: 4

# ─────────────────────────────────────────────
# CAPABILITY CONTRACT
# A module is complete only when the learner
# satisfies all evidence items below.
# ─────────────────────────────────────────────
capability:
  statement: >
    Implement, test, explain, experiment with, and debug a binary perceptron
    using only Python and optionally NumPy, without copying the reference
    implementation.
  evidence:
    - reference implementation passes all automated tests
    - learner's own implementation classifies AND and OR correctly
    - learner demonstrates and explains why XOR fails (geometric reasoning)
    - learner completes the constrained engineering challenge within 45 minutes
    - learner explains the role of weights, bias, learning rate, and epochs in writing

# ─────────────────────────────────────────────
# PREREQUISITES
# ─────────────────────────────────────────────
prerequisites:
  concepts:
    - variables
    - functions
    - vectors
    - dot_product
  coding:
    - basic_python
    - loops
    - classes

# ─────────────────────────────────────────────
# LEARNING OUTCOMES
# ─────────────────────────────────────────────
learning_outcomes:
  - explain the perceptron as a weighted decision system
  - derive the prediction rule from first principles
  - derive the update rule from first principles
  - implement a perceptron using built-in Python only
  - implement an equivalent NumPy version
  - visualize a linear decision boundary
  - diagnose non-linearly-separable data and explain the geometric reason
  - identify at least two situations where a perceptron should not be used

