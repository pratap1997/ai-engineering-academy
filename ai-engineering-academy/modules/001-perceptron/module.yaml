  implementation:       04-implementation.py
  experiments:          05-experiments.ipynb
  real_applications:    06-real-applications.md
  engineering_challenge: 07-engineering-challenge.md
  assessment:           08-assessment.md
  references:           09-references.md

# ─────────────────────────────────────────────
# EXPERIMENTS
# ─────────────────────────────────────────────
experiments:
  - and_gate
  - or_gate
  - xor_failure
  - remove_bias
  - learning_rate_comparison
  - training_order_shuffle
  - noisy_data
  - implementation_scaling    # 10 / 1,000 / 10,000 samples

# ─────────────────────────────────────────────
# LABEL CONVENTION
# This module uses 0 / 1 labels (not +1 / -1).
# Reason: more natural for binary classification
# tasks and consistent with Module 002 onward
# (binary cross-entropy, logistic regression).
# The update rule is: w += η(y - ŷ)x
# ─────────────────────────────────────────────
label_convention: binary_0_1

