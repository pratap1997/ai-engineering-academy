id: 006-cnn-basics
title: "Convolutional Neural Networks (Kernels, Convolutions & Pooling)"
version: "1.0.0"
difficulty: "Intermediate"
prerequisites:
  - "001-perceptron"
  - "002-multilayer"
  - "003-backprop"
  - "004-training-loops"
  - "005-regularization"
estimated_minutes: 90
author: "AI Engineering Academy"
license: "MIT"
created_date: "2026-08-01"

summary: >
  Implements 2D Convolutions, Padding, Stride, Max/Average Pooling, and Receptive Field math
  from scratch in pure Python & NumPy, demonstrating spatial feature extraction and analytical CNN backpropagation.

outcomes:
  - "Implement Conv2D, MaxPool2D, AvgPool2D, and Flatten layers from scratch in pure Python & NumPy"
  - "Derive output dimension math O = floor((W - K + 2P)/S) + 1 and receptive field growth"
  - "Demonstrate spatial edge detection using Sobel and Laplacian kernels"
  - "Derive analytical backward passes for Conv2D and MaxPool2D gradient routing"

sources:
  - name: "LeCun et al. (1998) Gradient-Based Learning Applied to Document Recognition"
    url: "http://yann.lecun.com/exdb/publis/pdf/lecun-98.pdf"
    type: "Paper"
  - name: "Krizhevsky, Sutskever, & Hinton (2012) ImageNet Classification with Deep Convolutional Neural Networks"
    url: "https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks.pdf"
    type: "Paper"
