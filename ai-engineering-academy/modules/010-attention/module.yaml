id: 010-attention
title: "Attention Mechanisms & Scaled Dot-Product Attention"
version: "1.0.0"
difficulty: "Advanced"
prerequisites:
  - "002-multilayer"
  - "003-backprop"
  - "008-rnn-basics"
  - "009-lstm-gru"
estimated_minutes: 90
author: "AI Engineering Academy"
license: "MIT"
created_date: "2026-08-01"

summary: >
  Implements Scaled Dot-Product Attention, Multi-Head Attention, and Positional Encoding
  from scratch in pure Python & NumPy, establishing the foundational building block of all Transformers.

outcomes:
  - "Implement ScaledDotProductAttention, MultiHeadAttention, and SinusoidalPositionalEncoding from scratch"
  - "Derive the attention score equation Attention(Q,K,V) = softmax(QK^T / sqrt(d_k)) * V"
  - "Prove why dividing by sqrt(d_k) prevents softmax saturation in high-dimensional spaces"
  - "Demonstrate how Multi-Head Attention enables attending to multiple semantic subspaces simultaneously"

sources:
  - name: "Vaswani et al. (2017) Attention Is All You Need"
    url: "https://arxiv.org/abs/1706.03762"
    type: "Paper"
  - name: "Bahdanau et al. (2015) Neural Machine Translation by Jointly Learning to Align and Translate"
    url: "https://arxiv.org/abs/1409.0473"
    type: "Paper"
