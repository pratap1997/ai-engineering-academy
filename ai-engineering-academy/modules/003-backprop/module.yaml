id: 003-backprop
title: "Backpropagation & Automatic Differentiation"
version: "1.0.0"
difficulty: "Intermediate"
prerequisites:
  - "001-perceptron"
  - "002-multilayer"
estimated_minutes: 75
author: "AI Engineering Academy"
license: "MIT"
created_date: "2026-08-01"

summary: >
  Builds a reverse-mode automatic differentiation engine from scratch in pure Python
  and derives the matrix calculus backpropagation equations used to train deep neural networks.

outcomes:
  - "Implement a reverse-mode automatic differentiation engine (Value node) with topological sorting"
  - "Derive vector and matrix backpropagation gradients for MSE and Binary Cross-Entropy loss functions"
  - "Verify analytical gradients against finite-difference numerical gradients to within 1e-6 relative tolerance"
  - "Train a multi-layer perceptron on XOR automatically from random weights using backpropagation"

sources:
  - name: "Rumelhart, Hinton, & Williams (1986) Learning representations by back-propagating errors"
    url: "https://www.nature.com/articles/323533a0"
    type: "Paper"
  - name: "Karpathy (2020) micrograd"
    url: "https://github.com/karpathy/micrograd"
    type: "Repository"
