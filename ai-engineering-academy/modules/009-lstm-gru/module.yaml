id: 009-lstm-gru
title: "Advanced Recurrent Architectures (LSTM, GRU & Gated Memory Units)"
version: "1.0.0"
difficulty: "Advanced"
prerequisites:
  - "001-perceptron"
  - "002-multilayer"
  - "003-backprop"
  - "004-training-loops"
  - "005-regularization"
  - "008-rnn-basics"
estimated_minutes: 90
author: "AI Engineering Academy"
license: "MIT"
created_date: "2026-08-01"

summary: >
  Implements LSTM cells (Forget, Input, Candidate, Output gates, Cell State C_t) and GRU cells (Reset, Update gates)
  from scratch in pure Python & NumPy, solving long-term vanishing gradients via Constant Error Carousel (CEC) dynamics.

outcomes:
  - "Implement LSTMCell, LSTMSequence, GRUCell, and GRUSequence from scratch in pure Python & NumPy"
  - "Derive the Constant Error Carousel (CEC) cell state derivative dC_t / dC_{t-1} = f_t"
  - "Demonstrate 100-step long-term dependency retrieval comparing Vanilla RNN (0% recall) vs LSTM (100% recall)"
  - "Compare parameter efficiency and computational speed between LSTM (4x gates) and GRU (3x gates)"

sources:
  - name: "Hochreiter & Schmidhuber (1997) Long Short-Term Memory"
    url: "https://dl.acm.org/doi/10.1162/neco.1997.9.8.1735"
    type: "Paper"
  - name: "Cho et al. (2014) Learning Phrase Representations using RNN Encoder-Decoder"
    url: "https://arxiv.org/abs/1406.1078"
    type: "Paper"
