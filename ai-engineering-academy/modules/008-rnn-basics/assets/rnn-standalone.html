<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 008 — Recurrent Unrolling & BPTT Gradient Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060610; --surface: #0d0d1a; --surface-2: #12122a;
      --border: rgba(255,255,255,0.08); --blue: #00d4ff; --purple: #8b5cf6;
      --green: #10b981; --red: #ef4444; --amber: #f59e0b;
      --text: #e2e8f0; --text-muted: #64748b;
      --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; height: 100vh; overflow: hidden; }
    #root { height: 100%; }
    .mono { font-family: var(--mono); }
    .text-blue { color: var(--blue); } .text-purple { color: var(--purple); }
    .text-green { color: var(--green); } .text-red { color: var(--red); } .text-amber { color: var(--amber); }
    .text-muted { color: var(--text-muted); }

    .app { display: flex; flex-direction: column; height: 100vh; }
    header { background: #0a0a18; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.4); color: var(--blue); font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
    
    main { flex: 1; display: grid; grid-template-columns: 280px 1fr 300px; min-height: 0; }
    aside { background: var(--surface); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid var(--border); }
    aside.right { border-right: none; border-left: 1px solid var(--border); }

    .sec-title { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .ctrl-row { margin-bottom: 8px; }
    .ctrl-lbl { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
    input[type=range] { width: 100%; accent-color: var(--blue); }

    .center-stage { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px; background: var(--bg); }
    .svg-wrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }

    .stat-card { background: var(--surface-2); padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [seqLength, setSeqLength] = useState(6);
      const [wMagnitude, setWMagnitude] = useState(1.4); // > 1.0 explodes
      const [useClipping, setUseClipping] = useState(true);

      // Compute exploding/vanishing gradient norm back through time
      const rawNorm = Math.pow(wMagnitude, seqLength);
      const clippedNorm = useClipping ? Math.min(1.0, rawNorm) : rawNorm;

      return (
        <div className="app">
          <header>
            <div style={{display: 'flex', gap: '12px', alignItems: 'center'}}>
              <span className="badge">MODULE 008</span>
              <h2 style={{fontSize: '18px', color: '#fff'}}>Unrolled Recurrent BPTT & Exploding Gradients</h2>
            </div>
            <div style={{display: 'flex', gap: '10px', alignItems: 'center', background: rawNorm > 10.0 ? 'rgba(239,68,68,0.15)' : 'rgba(16,185,129,0.15)', border: `1px solid ${rawNorm > 10.0 ? '#ef4444' : '#10b981'}`, padding: '4px 12px', borderRadius: '8px', color: rawNorm > 10.0 ? '#ef4444' : '#10b981'}}>
              <span style={{fontSize: '10px', letterSpacing: '1px'}}>BPTT GRADIENT NORM</span>
              <strong className="mono" style={{fontSize: '16px'}}>{clippedNorm.toFixed(2)} {useClipping && rawNorm > 1.0 ? `(Clipped from ${rawNorm.toFixed(1)})` : ''}</strong>
            </div>
          </header>

          <main>
            {/* Left Controls */}
            <aside>
              <div>
                <div className="sec-title">Sequence Controls</div>
                <div className="ctrl-row">
                  <div className="ctrl-lbl"><span className="text-blue">Sequence Length T</span><span className="mono">{seqLength}</span></div>
                  <input type="range" min="2" max="12" step="1" value={seqLength} onChange={e => setSeqLength(+e.target.value)}/>
                </div>

                <div className="ctrl-row" style={{marginTop: '12px'}}>
                  <div className="ctrl-lbl"><span className="text-purple">Recurrent Weight |W_hh|</span><span className="mono">{wMagnitude.toFixed(2)}</span></div>
                  <input type="range" min="0.5" max="2.0" step="0.05" value={wMagnitude} onChange={e => setWMagnitude(+e.target.value)}/>
                </div>
              </div>

              <div>
                <div className="sec-title">Exploding Gradient Defense</div>
                <label style={{display: 'flex', gap: '8px', alignItems: 'center', cursor: 'pointer', fontSize: '13px'}}>
                  <input type="checkbox" checked={useClipping} onChange={e => setUseClipping(e.target.checked)}/>
                  <span>Enable Gradient Clipping (Max Norm = 1.0)</span>
                </label>
              </div>
            </aside>

            {/* Center Stage Unrolled Architecture */}
            <div className="center-stage">
              <div className="svg-wrap">
                <svg viewBox="0 0 800 450" style={{width: '100%', height: '100%', maxWidth: 800}}>
                  <defs>
                    <filter id="g-blue"><feDropShadow dx="0" dy="0" stdDeviation="4" floodColor="#00d4ff" floodOpacity="0.8"/></filter>
                    <filter id="g-red"><feDropShadow dx="0" dy="0" stdDeviation="4" floodColor="#ef4444" floodOpacity="0.8"/></filter>
                  </defs>

                  {/* Unrolled Cell Chain */}
                  {Array.from({length: seqLength}).map((_, t) => {
                    const cx = 80 + t * (640 / (seqLength - 1 || 1));
                    const isExploding = wMagnitude > 1.0 && !useClipping;
                    return (
                      <g key={t}>
                        {/* Recurrent State Arrow (h_{t-1} -> h_t) */}
                        {t < seqLength - 1 && (
                          <line x1={cx + 25} y1="225" x2={cx + (640 / (seqLength - 1 || 1)) - 25} y2="225" stroke={isExploding ? '#ef4444' : '#00d4ff'} strokeWidth="2.5" filter="url(#g-blue)"/>
                        )}

                        {/* Input Arrow x_t -> Cell */}
                        <line x1={cx} y1="340" x2={cx} y2="250" stroke="rgba(255,255,255,0.3)" strokeWidth="1.5"/>
                        <text x={cx} y="360" fill="var(--text-muted)" fontSize="11" fontFamily="JetBrains Mono" textAnchor="middle">x_{t+1}</text>

                        {/* Output Arrow Cell -> y_t */}
                        <line x1={cx} y1="200" x2={cx} y2="110" stroke="rgba(255,255,255,0.3)" strokeWidth="1.5"/>
                        <text x={cx} y="95" fill="#10b981" fontSize="11" fontFamily="JetBrains Mono" textAnchor="middle">y_{t+1}</text>

                        {/* Cell Node */}
                        <rect x={cx - 22} y="205" width="44" height="40" rx="6" fill="var(--surface-2)" stroke={isExploding ? '#ef4444' : '#00d4ff'} strokeWidth="2"/>
                        <text x={cx} y="230" fill="#fff" fontSize="11" fontFamily="JetBrains Mono" textAnchor="middle">h_{t+1}</text>
                      </g>
                    );
                  })}
                </svg>
              </div>

              <div style={{color: 'var(--text-muted)', fontSize: '12px'}}>
                BPTT Unrolled Chain: <strong className="mono text-blue">h_t = tanh(x_t * W_xh + h_t-1 * W_hh + b_h)</strong>
              </div>
            </div>

            {/* Right Metrics */}
            <aside className="right">
              <div className="sec-title">Recurrent Spectral Radius</div>
              
              <div className="stat-card">
                <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>Spectral Radius ρ(W_hh)</div>
                <div className={`mono ${wMagnitude > 1.0 ? 'text-red' : 'text-green'}`} style={{fontSize: '18px', fontWeight: 'bold'}}>{wMagnitude.toFixed(2)}</div>
              </div>

              <div className="stat-card">
                <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>Unclipped BPTT Gradient Norm</div>
                <div className={`mono ${rawNorm > 10.0 ? 'text-red' : 'text-blue'}`} style={{fontSize: '18px', fontWeight: 'bold'}}>{rawNorm > 1e6 ? 'INF / EXPLODED' : rawNorm.toFixed(2)}</div>
              </div>

              <div style={{background: 'rgba(0,212,255,0.08)', border: '1px solid rgba(0,212,255,0.3)', padding: '12px', borderRadius: '8px', fontSize: '11px', lineHeight: '1.6'}}>
                <strong>Exploding Gradient Mechanics:</strong>
                <p style={{marginTop: '4px'}}>When <code>|W_hh| &gt; 1.0</code>, unrolling over length {seqLength} computes <code>{wMagnitude.toFixed(2)}^{seqLength} = {rawNorm.toFixed(1)}</code>, causing gradient explosion without clipping.</p>
              </div>
            </aside>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
