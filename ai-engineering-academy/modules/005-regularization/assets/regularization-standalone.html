<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 005 — Regularization & Overfitting Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060610; --surface: #0d0d1a; --surface-2: #12122a;
      --border: rgba(255,255,255,0.08); --blue: #00d4ff; --purple: #8b5cf6;
      --green: #10b981; --red: #ef4444; --amber: #f59e0b;
      --text: #e2e8f0; --text-muted: #64748b;
      --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; height: 100vh; overflow: hidden; }
    #root { height: 100%; }
    .mono { font-family: var(--mono); }
    .text-blue { color: var(--blue); } .text-purple { color: var(--purple); }
    .text-green { color: var(--green); } .text-red { color: var(--red); } .text-amber { color: var(--amber); }
    .text-muted { color: var(--text-muted); }

    .app { display: flex; flex-direction: column; height: 100vh; }
    header { background: #0a0a18; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.4); color: var(--amber); font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
    
    main { flex: 1; display: grid; grid-template-columns: 280px 1fr 300px; min-height: 0; }
    aside { background: var(--surface); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid var(--border); }
    aside.right { border-right: none; border-left: 1px solid var(--border); }

    .sec-title { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .ctrl-row { margin-bottom: 8px; }
    .ctrl-lbl { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
    input[type=range] { width: 100%; accent-color: var(--amber); }

    .btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
    .btn.active { border-color: var(--amber); color: var(--amber); background: rgba(245,158,11,0.15); }
    .btn:hover { border-color: var(--amber); color: var(--amber); }

    .center-stage { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px; background: var(--bg); }
    .svg-wrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }

    .stat-card { background: var(--surface-2); padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [regMode, setRegMode] = useState('l2'); // 'none', 'l1', 'l2', 'dropout'
      const [strength, setStrength] = useState(0.5);

      // Simulated weights distribution
      const getWeights = () => {
        if (regMode === 'none') {
          return [4.5, -3.8, 5.2, -4.1, 3.9, -4.8];
        } else if (regMode === 'l1') {
          return [Math.max(0, 4.5 - strength*4.5), 0.0, Math.max(0, 5.2 - strength*5.0), 0.0, 0.0, 0.0];
        } else if (regMode === 'l2') {
          const factor = 1.0 / (1.0 + strength * 2.0);
          return [4.5*factor, -3.8*factor, 5.2*factor, -4.1*factor, 3.9*factor, -4.8*factor];
        } else { // dropout
          return [4.5, 0.0, 5.2, 0.0, 3.9, 0.0];
        }
      };

      const weights = getWeights();
      const normL1  = weights.reduce((acc, w) => acc + Math.abs(w), 0);
      const normL2  = Math.sqrt(weights.reduce((acc, w) => acc + w*w, 0));
      const zeros   = weights.filter(w => Math.abs(w) < 1e-3).length;

      return (
        <div className="app">
          <header>
            <div style={{display: 'flex', gap: '12px', alignItems: 'center'}}>
              <span className="badge">MODULE 005</span>
              <h2 style={{fontSize: '18px', color: '#fff'}}>Regularization Geometry & Weight Distributions</h2>
            </div>
            <div style={{display: 'flex', gap: '10px', alignItems: 'center', background: 'rgba(245,158,11,0.12)', border: '1px solid #f59e0b', padding: '4px 12px', borderRadius: '8px', color: '#f59e0b'}}>
              <span style={{fontSize: '10px', letterSpacing: '1px'}}>ZERO WEIGHTS (SPARSITY)</span>
              <strong className="mono" style={{fontSize: '16px'}}>{zeros} / {weights.length}</strong>
            </div>
          </header>

          <main>
            {/* Left Controls */}
            <aside>
              <div>
                <div className="sec-title">Regularization Technique</div>
                <div style={{display: 'flex', flexDirection: 'column', gap: '6px'}}>
                  <button className={`btn ${regMode==='none'?'active':''}`} onClick={()=>setRegMode('none')}>None (Overfitted)</button>
                  <button className={`btn ${regMode==='l1'?'active':''}`} onClick={()=>setRegMode('l1')}>L1 Regularization (Lasso)</button>
                  <button className={`btn ${regMode==='l2'?'active':''}`} onClick={()=>setRegMode('l2')}>L2 Regularization (Ridge)</button>
                  <button className={`btn ${regMode==='dropout'?'active':''}`} onClick={()=>setRegMode('dropout')}>Inverted Dropout (p=0.5)</button>
                </div>
              </div>

              <div>
                <div className="sec-title">Penalty Strength λ</div>
                <div className="ctrl-row">
                  <div className="ctrl-lbl"><span className="text-amber">Strength</span><span className="mono">{strength.toFixed(2)}</span></div>
                  <input type="range" min="0.0" max="1.0" step="0.05" value={strength} onChange={e => setStrength(+e.target.value)}/>
                </div>
              </div>
            </aside>

            {/* Center Stage SVG Histogram / Geometry */}
            <div className="center-stage">
              <div className="svg-wrap">
                <svg viewBox="0 0 800 450" style={{width: '100%', height: '100%', maxWidth: 800}}>
                  <defs>
                    <filter id="g-amber"><feDropShadow dx="0" dy="0" stdDeviation="5" floodColor="#f59e0b" floodOpacity="0.8"/></filter>
                  </defs>

                  {/* Axis */}
                  <line x1="100" y1="380" x2="700" y2="380" stroke="rgba(255,255,255,0.2)" strokeWidth="2"/>
                  <line x1="100" y1="80" x2="100" y2="380" stroke="rgba(255,255,255,0.2)" strokeWidth="2"/>

                  <text x="400" y="420" fill="rgba(255,255,255,0.4)" fontSize="11" textAnchor="middle">WEIGHT INDEX (w₁ ... w₆)</text>
                  <text x="60" y="230" fill="rgba(255,255,255,0.4)" fontSize="11" textAnchor="middle" transform="rotate(-90 60 230)">MAGNITUDE |w|</text>

                  {/* Bars for weights */}
                  {weights.map((w, i) => {
                    const bx = 160 + i * 90;
                    const h  = Math.abs(w) * 50;
                    const by = 380 - h;
                    const isZero = Math.abs(w) < 1e-3;
                    return (
                      <g key={i}>
                        <rect x={bx} y={by} width="50" height={h} rx="4" fill={isZero ? 'rgba(239,68,68,0.2)' : 'rgba(245,158,11,0.6)'} stroke={isZero ? '#ef4444' : '#f59e0b'} strokeWidth="1.5"/>
                        <text x={bx + 25} y={by - 8} fill={isZero ? '#ef4444' : '#fff'} fontSize="11" fontFamily="JetBrains Mono" textAnchor="middle">{w.toFixed(2)}</text>
                        <text x={bx + 25} y="398" fill="rgba(255,255,255,0.5)" fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle">w{i+1}</text>
                      </g>
                    );
                  })}
                </svg>
              </div>

              <div style={{color: 'var(--text-muted)', fontSize: '12px'}}>
                Mode: <strong className="mono text-amber">{regMode.toUpperCase()}</strong>
              </div>
            </div>

            {/* Right Metrics */}
            <aside className="right">
              <div className="sec-title">Norm & Sparsity Metrics</div>
              
              <div className="stat-card">
                <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>L1 Norm (Sum |w|)</div>
                <div className="mono text-amber" style={{fontSize: '20px', fontWeight: 'bold'}}>{normL1.toFixed(3)}</div>
              </div>

              <div className="stat-card">
                <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>L2 Norm (Sqrt Sum w²)</div>
                <div className="mono text-blue" style={{fontSize: '20px', fontWeight: 'bold'}}>{normL2.toFixed(3)}</div>
              </div>

              <div className="stat-card">
                <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>Sparsity Ratio</div>
                <div className="mono text-green" style={{fontSize: '20px', fontWeight: 'bold'}}>{((zeros / weights.length)*100).toFixed(0)}%</div>
              </div>

              <div style={{background: 'rgba(245,158,11,0.08)', border: '1px solid rgba(245,158,11,0.3)', padding: '12px', borderRadius: '8px', fontSize: '11px', lineHeight: '1.6'}}>
                {regMode === 'none' && 'No penalty: Large weights overfit noise easily.'}
                {regMode === 'l1'   && 'L1 Penalty: Drives small weights to EXACT ZERO (sparsity & feature selection).'}
                {regMode === 'l2'   && 'L2 Penalty: Shrinks all weights smoothly, preventing large spikes.'}
                {regMode === 'dropout'&& 'Dropout: Randomly zeroes units during training to prevent feature co-adaptation.'}
              </div>
            </aside>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
